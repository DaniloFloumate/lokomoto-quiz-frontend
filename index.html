<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lokomoto Quiz</title>

  <!-- Instrument Sans font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Glavni container koji drži quiz -->
<div class="quiz-container">

  <!-- Header sa back dugmetom + progress bar -->
  <div class="quiz-header">
    <button class="quiz-header__back hidden" id="globalBackBtn" aria-label="Nazad">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <div class="progress-bar" id="progressBar">
      <div class="progress-bar__fill" id="progressBarFill"></div>
    </div>
  </div>

    <!-- Quiz screens — sve generišemo kroz JS -->
    <div class="quiz-screens" id="quizScreens">
      <!-- Inicijalni loading state, prebrisuje se u quiz.js -->
      <div class="loading">Učitavanje...</div>
    </div>

  </div>

  <!-- JavaScript -->
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
